[build]
builder = "nixpacks"
buildCommand = "npm run build"

[env]
NIXPACKS_NODE_VERSION = "22"

[deploy]
startCommand = "node -e \"if (!require('fs').existsSync('api/dist/index.js')) { console.log('⚡ Compilando API no startup...'); require('child_process').execSync('npx tsc', { cwd: 'api', stdio: 'inherit' }); } require('./api/dist/index.js');\""
